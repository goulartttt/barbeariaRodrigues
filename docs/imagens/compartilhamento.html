<!doctype html><html><head><meta charset="utf-8">
<!-- Origem de src/app/opengraph-image.png (1200x630), a imagem que aparece ao compartilhar o link. Se a nota do Google ou o visual mudarem, edite aqui e capture de novo em 1200x630. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=block" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:#0b0a09;color:#efe7d8;font-family:Archivo,sans-serif;overflow:hidden}
  .glow{position:absolute;inset:0;background:radial-gradient(circle at 76% 46%,rgb(184 146 90/.22),transparent 46%)}
  .tools{position:absolute;right:-30px;top:40px;width:640px;height:520px;object-fit:contain}
  .wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
  .mark{text-transform:uppercase;line-height:1}
  .mark b{display:block;font-size:30px;font-weight:800;letter-spacing:.04em;font-variation-settings:"wdth" 80}
  .mark span{display:block;margin-top:6px;font-size:14px;font-weight:500;letter-spacing:.46em;color:#b8925a;font-variation-settings:"wdth" 125}
  .eyebrow{margin-top:auto;font-size:20px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#b8925a;font-variation-settings:"wdth" 125}
  h1{margin-top:18px;text-transform:uppercase;line-height:.88;font-variation-settings:"wdth" 62}
  h1 .a{display:block;font-size:132px;font-weight:400}
  h1 .b{display:block;font-size:132px;font-weight:800;color:#d4b07a}
  .foot{margin-top:34px;display:flex;gap:28px;align-items:center;font-size:24px;color:#a89f91}
  .foot strong{color:#efe7d8;font-weight:700}
  .stars{color:#d4b07a;letter-spacing:.12em}
  .dot{width:5px;height:5px;border-radius:50%;background:#b8925a}
</style></head><body>
<div class="glow"></div>
<img class="tools" src="../../public/images/3d/navalha-tesoura.png" alt="">
<div class="wrap">
  <div class="mark"><b>Rodrigues</b><span>Barbearia</span></div>
  <p class="eyebrow">Vila Aurora · Zona Norte · SP</p>
  <h1><span class="a">Precisão</span><span class="b">de navalha.</span></h1>
  <div class="foot"><span><span class="stars">★★★★★</span> <strong>5,0</strong> no Google</span><i class="dot"></i><span>Agende online</span></div>
</div>
</body></html>
